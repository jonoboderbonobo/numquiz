[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numquiz"
dynamic = ["version"]
description = "Terminal quiz for converting between binary, hex and decimal (0-15)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jonas Boerschmann" }]
requires-python = ">=3.8"
dependencies = ["windows-curses; platform_system == 'Windows'"]
keywords = ["binary", "hexadecimal", "quiz", "terminal", "learning"]
classifiers = [
    "Environment :: Console :: Curses",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.scripts]
numquiz = "numquiz:main"

[tool.setuptools]
py-modules = ["numquiz"]

[tool.setuptools.dynamic]
version = { attr = "numquiz.__version__" }
